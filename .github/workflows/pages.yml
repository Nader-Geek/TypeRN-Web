# Publishes the web app (TypeR Web + Auto-place / bubble detection) to GitHub Pages.
# Settings > Pages > Source must be "GitHub Actions". The upstream CNAME is NOT published.
name: Deploy web app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only what the app needs, without the CNAME)
        run: |
          mkdir _site
          cp -r web assets images _site/
          cp i18n.js favicon.svg og.png _site/ 2>/dev/null || true
          touch _site/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=web/"><link rel="canonical" href="web/"><a href="web/">TypeR Web</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
