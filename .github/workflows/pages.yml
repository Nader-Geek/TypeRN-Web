# Publishes the upstream TypeR Web app at the GitHub Pages project path.
# Set Settings > Pages > Source to GitHub Actions.
name: Deploy web app to GitHub Pages
on:
  push:
    branches: [feature/manhuarmtl-chapter-import]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site without the upstream custom domain
        run: |
          mkdir _site
          cp -r web assets images _site/
          cp i18n.js favicon.svg og.png _site/ 2>/dev/null || true
          touch _site/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=web/"><link rel="canonical" href="web/"><title>TypeR Web</title><a href="web/">TypeR Web</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
