<!doctype html><meta charset="utf-8">
<style>
@font-face { font-family: "Wildjess"; font-weight: 400; font-style: normal; font-display: swap; src: url("/assets/fonts/wildjess-normal.woff2") format("woff2"); }
@font-face { font-family: "Wildjess"; font-weight: 400; font-style: italic; font-display: swap; src: url("/assets/fonts/wildjess-italic.woff2") format("woff2"); }
@font-face { font-family: "Wildjess"; font-weight: 700; font-style: italic; font-display: swap; src: url("/assets/fonts/wildjess-bolditalic.woff2") format("woff2"); }
@font-face { font-family: "Bangers"; font-weight: 400; font-style: normal; font-display: swap; src: url("/assets/fonts/bangers-400.woff2") format("woff2"); }
body { margin: 0; display: flex; background: #14100f; }
#c { width: 620px; height: 806px; background: #fff; }
iframe { width: 460px; height: 806px; border: 0; }
</style>
<canvas id="c"></canvas>
<iframe id="p"></iframe>
<script src="/web/fonts.js"></script>
<script src="/web/kit.js"></script>
<script src="/web/photoshop.js"></script>
<script src="/scripts/seed.js"></script>
<script>
const PS = window.TypeRPhotoshop;
const query = new URLSearchParams(location.search);
if (query.get("script")) window.TypeRSeed.scriptOverride = JSON.parse(query.get("script"));
if (query.get("preview")) {
  const storage = window.TypeRSeed.storage;
  window.TypeRSeed.storage = (language) => {
    const data = storage(language);
    data.uiLayout.sizes.previewHeight = Number(query.get("preview"));
    data.bottomHeight = 150;
    return data;
  };
}
const canvas = document.getElementById("c");
// drawCleanOps sizes its scratch canvas by the doc: it is drawn scaled here
window.paintDoc = (target) => {
  const d = PS.app.doc;
  target.width = d.width;
  target.height = d.height;
  const x = target.getContext("2d");
  PS.paintDoc(d, x);
};
PS.on((type) => { if (type === "render" && PS.app.doc) window.paintDoc(canvas); });
window.ready = (async () => {
  await PS.ops.fontsReady();
  await PS.ops.loadImage("/assets/page/page-01.webp", "page-01.png", "sample://page-01");
  document.getElementById("p").src = "/web/panel/index.html?seeded=1&lang=" + (query.get("lang") || "en");
})();
// Crops come from the same art drawn three times larger, with the same layers
window.PAGE_SCALE = 3;
const art = document.createElement("script");
art.src = "/scripts/page-art.js";
document.head.appendChild(art);
window.cropTo = (rect, width, type, quality, ants) => {
  const S = 3;
  const d = PS.app.doc;
  const full = document.createElement("canvas");
  full.width = d.width * S;
  full.height = d.height * S;
  const x = full.getContext("2d");
  x.drawImage(window.pageArt.canvas, 0, 0);
  x.save();
  x.scale(S, S);
  d.state.layers.filter((l) => l.clean && l.visible !== false).forEach((l) => l.paint.forEach((op) => PS.drawOp(x, op)));
  d.state.layers.forEach((l) => { if (l.kind === "text" && l.visible !== false) PS.drawTextLayer(x, l, d); });
  if (ants) {
    x.lineWidth = 3;
    d.state.selection.rings.forEach((ring) => {
      x.beginPath();
      ring.forEach((p, i) => (i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])));
      x.closePath();
      x.setLineDash([]);
      x.strokeStyle = "#fff";
      x.stroke();
      x.setLineDash([9, 9]);
      x.strokeStyle = "#000";
      x.stroke();
    });
  }
  x.restore();
  const out = document.createElement("canvas");
  const scale = width / (rect.w * S);
  out.width = Math.round(rect.w * S * scale);
  out.height = Math.round(rect.h * S * scale);
  const c = out.getContext("2d");
  c.imageSmoothingQuality = "high";
  c.drawImage(full, rect.x * S, rect.y * S, rect.w * S, rect.h * S, 0, 0, out.width, out.height);
  return out.toDataURL(type || "image/webp", quality || 0.88);
};
</script>
