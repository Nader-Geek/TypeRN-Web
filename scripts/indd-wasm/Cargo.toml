[package]
name = "indd-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
indd = { git = "https://github.com/storytold/indd-utils", rev = "136f973a9d5f1b3ef34e46e27f4a08af196efde7" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

