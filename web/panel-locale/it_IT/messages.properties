## new in TypeR 3.0
walkthroughPartBasics=Le basi
walkthroughPartMore=Per andare oltre
walkthroughMorePrepTitle=La pagina di esercizio successiva
walkthroughMorePrepIntro=Conosci le basi: ora, ciò che TypeR fa per te. Questa parte ha una propria pagina di esercizio con balloon numerati e un proprio script, una riga per balloon.
walkthroughMoreSmartPasteIntro=TypeR legge il vero contorno di un balloon e vi dispone il testo, anche quando è troppo lungo.
walkthroughDoneCleanup=Chiudi le due pagine di esercizio in Photoshop senza salvarle.
walkthroughCloseTabs=Chiudi le schede di esercizio
walkthroughPagesTitle=Segui le tue pagine
walkthroughPagesIntro=Collega i file PSD di un capitolo al tuo script: man mano che scorri le righe, TypeR apre la pagina a cui appartengono.
walkthroughPagesStep1=Fai clic sull'icona della cartella (Importa pagine) in fondo al pannello, poi seleziona i file PSD di un capitolo. Non ne hai a portata di mano? Fai clic su Salta.
walkthroughPagesResult1=TypeR ha aperto il file della pagina 1. Ogni riga «Page 12» di uno script apre ora il file con quel numero nel nome. Lo stesso pulsante scollega i file.
settingsLayoutModeIcons=Mostra sempre le icone
settingsLayoutModeIconsNote=Altrimenti, le icone sostituiscono i nomi solo quando il pannello è troppo stretto.
settingsAutoCenterSmartPasteNote=L'incolla intelligente posiziona il testo da solo: questa impostazione si applica solo quando ripiega sull'incolla classico.
shortcut_toggleStyleStroke=Attiva/disattiva il contorno dello stile
shortcut_toggleStyleStrokeDescr=Attiva o disattiva il contorno dello stile selezionato, mantenendone dimensione e colore. Uno stile senza contorno ne riceve uno bianco di 3 px. Uno stile con un contorno attivo mostra una cornice di quel colore nell'elenco.
styleStrokeEnabled=Contorno attivato
styleStrokeDisabled=Contorno disattivato
whatsNewFontsStep1=FontScanR: apri le impostazioni con l'ingranaggio in fondo al pannello, poi la scheda Dati, e fai clic su Apri accanto a FontScanR.
whatsNewFontsResult1=I font mancanti vengono cercati su Font FindeR, in FontScanR e quando importi una cartella di stili: un clic installa un risultato, o tutti insieme.
whatsNewFontsCoachScan=FontScanR: scegli dei file .psd. Elenca ogni font usato, con dimensione, colore e contorno, e trasforma in stili quelli che spunti. Un font che non hai viene cercato su Font FindeR: installalo direttamente dall'elenco.
