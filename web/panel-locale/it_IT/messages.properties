## What's new tour
whatsNewTimeSeconds={count} s
whatsNewTimeMinutes={count} min
whatsNewTimeMinutesSeconds={minutes} min {seconds}
whatsNewPrepTitle=Preparazione
whatsNewPrepIntro=Il tour è pratico: TypeR apre una pagina di esercitazione con balloon numerati e uno script di esercitazione, una riga per balloon.
whatsNewPrepOpenText=Apri la pagina di esercitazione in Photoshop.
whatsNewPrepOpenResult=Si apre come un normale documento: 10 punti numerati, uno per esercizio, da leggere da destra a sinistra come un manga. Chiudila senza salvare alla fine.
whatsNewPrepScriptText=Carica lo script di esercitazione. Si apre in una nuova scheda: i tuoi script restano intatti.
whatsNewPrepScriptResult=Ogni riga di questo script va nel balloon con lo stesso numero.
whatsNewPrepStyleText=Nell'elenco degli stili, fai clic su quello che usi di solito per i dialoghi. Gli esercizi lo useranno.
whatsNewPrepStyleResult=Pronto. Tieni aperta questa guida: convalida da sola ogni esercizio.
whatsNewSmartPasteTitle=Incolla intelligente
whatsNewSmartPasteIntro=Fino alla 2.5, il testo riempiva il rettangolo della selezione. Ora TypeR legge il contorno reale del balloon e dispone il testo al suo interno.
whatsNewSmartPasteStep1=Balloon 1: in Photoshop, prendi la Bacchetta magica (W) e fai clic dentro il balloon grande. Poi fai clic su Incolla nel pannello.
whatsNewSmartPasteResult1=Le righe seguono la curva: corte in alto e in basso, lunghe al centro, e il blocco è centrato nel balloon. La dimensione dello stile è stata mantenuta perché il testo entra.
whatsNewSmartPasteStep2=Balloon 2: stesso gesto nel balloon piccolo. Questa riga è troppo lunga per entrarci…
whatsNewSmartPasteResult2=…quindi TypeR ha ridotto il testo quanto basta per farlo entrare, fino al 75% della dimensione dello stile al massimo. Una sola sillabazione è consentita solo come ultima risorsa. Entrambe le cose si possono cambiare in Impostazioni > Inserimento.
whatsNewPasteOnClickTitle=Incolla al clic
whatsNewPasteOnClickIntro=Non serve più incollare: basta la selezione. Ogni clic con la Bacchetta magica (o rettangolo, o lazo) incolla la riga corrente e passa alla successiva.
whatsNewPasteOnClickStep1=Attiva “Incolla al clic” in fondo al pannello.
whatsNewPasteOnClickResult1=È attivo. La modalità multi-balloon si disattiva: le due non funzionano insieme.
whatsNewPasteOnClickStep2=Con la Bacchetta magica, fai clic dentro il balloon 3, poi dentro il balloon 4. Nient'altro da fare.
whatsNewPasteOnClickResult2=Un clic, una riga: TypeR segue i tuoi clic nello script.
whatsNewPasteOnClickStep3Uxp=Premi Ctrl+Z (Cmd+Z su Mac) in Photoshop: il testo del balloon 4 sparisce e la sua riga torna a essere la riga corrente.
whatsNewPasteOnClickStep3Legacy=Premi Ctrl+Z (Cmd+Z su Mac) in Photoshop, poi fai clic nel pannello TypeR: il testo del balloon 4 sparisce e la sua riga torna a essere la riga corrente.
whatsNewPasteOnClickResult3=Il balloon 4 è tornato. Disattiva la modalità quando ritocchi la pagina, altrimenti ogni selezione incolla una riga.
whatsNewBubblesTitle=Ogni tipo di balloon
whatsNewBubblesIntro=L'incolla intelligente riconosce il tipo di balloon e adatta il testo. Incolla al clic può restare attivo: un clic per balloon.
whatsNewBubblesStep1=Il balloon 6 è nero: incollaci dentro la riga successiva.
whatsNewBubblesResult1=Testo bianco senza contorno, in automatico. Il tuo stile in sé non cambia.
whatsNewBubblesStep2=Il balloon 7 è un balloon doppio: un solo clic o incolla nella sua parte superiore.
whatsNewBubblesResult2=Due righe, una per parte, in un solo passaggio della cronologia: un solo Ctrl+Z annulla entrambe. I balloon tripli funzionano allo stesso modo. Se TypeR mette una sola riga in un balloon doppio, fai di nuovo clic nello stesso balloon: lo divide e incolla la riga successiva nell'altra parte.
whatsNewBubblesStep3=Per i balloon di urlo, TypeR usa lo stile contrassegnato “Urlo” nella cartella dello stile corrente. Fai clic sulla matita dello stile che vuoi usare per loro, diverso dal tuo stile per i dialoghi. Oppure creane uno: clic destro sul tuo stile per i dialoghi, poi Duplica stile.
whatsNewBubblesResult3=Lo stile Urlo viene usato solo per i balloon rilevati come urli. Un tag sulla riga dello script ha sempre la precedenza.
whatsNewBubblesResult3Existing=Il tuo stile “{name}” è già contrassegnato come Urlo: TypeR lo usa solo per i balloon rilevati come urli. Un tag sulla riga dello script ha sempre la precedenza.
whatsNewBubblesStep4=Il balloon 9 è a punte: incollaci dentro la riga successiva. Il tuo stile corrente non è lo stile Urlo.
whatsNewBubblesResult4=TypeR ha riconosciuto un urlo e ha usato lo stile Urlo al posto dello stile corrente.
whatsNewBubblesResult4Missed=Lo stile Urlo non è stato usato: controlla che si trovi nella stessa cartella dello stile corrente, poi riprova.
whatsNewBubblesStep5=Il balloon 8 ha ancora le scritte originali. Attiva Pulizia auto, poi incollaci dentro la riga successiva.
whatsNewBubblesResult5=Un livello “TypeR Clean” ha dipinto il balloon sotto il testo: le scritte originali sono nascoste, nulla viene cancellato. Funziona solo sui balloon bianchi o neri uniformi.
whatsNewTextShapeRTitle=TextShapeR
whatsNewTextShapeRIntro=TextShapeR suggerisce diversi modi di spezzare le righe di un livello di testo per il suo balloon, dal migliore in giù. Comodo per ritoccare un balloon già composto.
whatsNewTextShapeRStep1=Attiva “TextShapeR” in fondo al pannello.
whatsNewTextShapeRResult1=I suggerimenti compaiono nel pannello, sotto l'anteprima. Puoi comprimere questa guida (▾) per vederli.
whatsNewTextShapeRStep2=In Photoshop, seleziona un livello di testo nel pannello Livelli, poi fai clic su una delle forme suggerite in TypeR.
whatsNewTextShapeRResult2=Il livello riceve le nuove interruzioni di riga. Maiusc+clic applica e passa alla riga successiva; Ctrl+Z torna indietro.
whatsNewTextShapeRStep3=Quando un suggerimento ti piace, fai clic sulla stella: TextShapeR impara come spezzi le tue righe (senza IA generativa).
whatsNewTextShapeRResult3=I suggerimenti successivi seguono il tuo stile. Questa lezione vale solo per il tour: viene annullata quando lasci questo capitolo, così il tuo apprendimento resta com'era.
whatsNewWorkflowTitle=Organizza il tuo lavoro
whatsNewWorkflowIntro=Più capitoli, team o progetti contemporaneamente, senza mescolare nulla.
whatsNewWorkflowStep1=Schede: fai clic sulla scheda precedente sopra lo script, poi torna alla scheda di esercitazione. Ogni scheda conserva il proprio script, la propria riga corrente e la propria cartella di PSD.
whatsNewWorkflowResult1=Fai doppio clic su una scheda per rinominarla. Trascinala per cambiarne l'ordine. Il pulsante + ne apre una nuova.
whatsNewWorkflowStep3=Preset di dimensione: fai clic sulla matita del tuo stile corrente per aprire l'editor degli stili.
whatsNewWorkflowResult3=La scorciatoia “Preset di dimensione del testo successivo” li scorre senza aprire nulla.
whatsNewFontsTitle=I tuoi font
whatsNewFontsIntro=Trasforma i font dei file PSD esistenti in stili e ottieni quelli che ti mancano, senza uscire da Photoshop.
whatsNewFontsStep2=Font FindeR: apri le impostazioni con l'ingranaggio in fondo al pannello, poi la scheda Font FindeR.
whatsNewFontsResult2=Un font installato può essere usato subito in uno stile.
