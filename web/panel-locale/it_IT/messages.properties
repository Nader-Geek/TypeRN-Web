whatsNewBubblesResult6Existing=Il tuo stile “{name}” è già contrassegnato come Narrazione: TypeR lo usa solo per i riquadri rilevati come narrazione.
whatsNewBubblesStep7=Il riquadro 10 è un riquadro di narrazione: selezionalo con la bacchetta magica e incollaci dentro l'ultima riga.
whatsNewBubblesResult7=TypeR ha riconosciuto un riquadro di narrazione e ha usato lo stile Narrazione.
whatsNewBubblesResult7Missed=Lo stile Narrazione non è stato usato: seleziona il riquadro con la bacchetta magica, controlla che si trovi nella stessa cartella dello stile corrente, poi riprova.
whatsNewPasteOnClickStep3Again=Annullato! Ora fai di nuovo clic dentro il balloon 4 con la Bacchetta magica per incollarlo di nuovo.
