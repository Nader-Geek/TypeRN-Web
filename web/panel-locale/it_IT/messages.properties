tipApplyStyleKeepSize=Tieni premuto Ctrl mentre fai clic sulla freccia ➜ di uno stile per applicarlo mantenendo la dimensione attuale del livello selezionato.
tipNumpadStyles=Quando il pannello è attivo, i tasti da 1 a 9 del tastierino numerico selezionano dal 1° al 9° stile della cartella corrente.
tipStyleContextMenu=Fai clic con il tasto destro su uno stile per copiarlo, incollarlo o duplicarlo. Il clic destro sull'intestazione di una cartella vi incolla lo stile copiato.
tipStyleContinuation=Nello script, una riga che inizia con // prende lo stile della riga precedente, così non devi ripetere il suo tag.
tipDeleteFolderWithStyles=Tieni premuto Maiusc mentre fai clic su “{delete}” nell'editor delle cartelle per eliminare anche i suoi stili, invece di spostarli in “{unsorted}”.
tipRenameTab=Fai doppio clic su una scheda per rinominarla. Trascinala per cambiarne l'ordine.
tipPageSync=Il tuo script contiene marcatori di pagina: fai clic su “{importPages}” in fondo al pannello per collegare i tuoi PSD, e TypeR aprirà la pagina giusta man mano che scorri le righe.
tipKeepSizePaste=Tieni premuto {keepSize} mentre incolli per mantenere la dimensione del livello di testo selezionato.
tipPasteMultipleLayers=Seleziona più livelli di testo in Photoshop senza alcuna selezione, poi fai clic su “{paste}”: vengono riempiti con le righe successive, nell'ordine in cui li hai selezionati.
tipAlignWithoutSelection=“{align}” funziona anche senza selezione: TypeR trova il balloon attorno al testo. Seleziona più livelli di testo per centrare ciascuno nel proprio balloon.
tipTextShapeRShiftApply=Maiusc+clic su un suggerimento di TextShapeR lo applica e passa alla riga successiva.
exportFontFilesMissing=Questi font non sono stati trovati su questo computer e non sono stati aggiunti all'archivio:
