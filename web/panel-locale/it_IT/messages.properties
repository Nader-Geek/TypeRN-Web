whatsNewIntroSpot=Ogni gesto lo fai tu: la guida evidenzia il pulsante da usare nel pannello.
whatsNewPracticeLine1=Benvenuto in TypeR 3.0! Questo testo segue la forma tonda del balloon invece di riempire un rettangolo.
