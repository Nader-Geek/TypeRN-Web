## walkthrough
walkthroughTitle=Tutorial di TypeR
walkthroughCoachTitle=Guida di TypeR
walkthroughPracticeTab=Esercitazione TypeR
walkthroughPracticeNote=Nota del traduttore: le righe che iniziano con ## non vengono mai incollate.
walkthroughPracticeLine1=Benvenuto in TypeR! Ogni riga dello script va nel suo balloon.
walkthroughPracticeLine2=Una selezione, un incolla e si passa alla riga successiva.
walkthroughPracticeLine3=Nel frattempo, lontano da qui...
walkthroughPracticeLine4=ATTENZIONE!
walkthroughShoutPrefix=URLO:
walkthroughIntroTitle=Benvenuto in TypeR
walkthroughIntroText=Impara TypeR usandolo: la guida apre in Photoshop una pagina di esercitazione e uno script di esercitazione, e ogni esercizio si convalida da solo appena lo svolgi.
walkthroughIntroSpot=Ogni gesto lo fai tu: la guida evidenzia il pulsante da usare nel pannello. Trascina la guida dall'intestazione oppure riducila con ▴.
walkthroughDoneHelp=L'Aiuto, il ? in fondo al pannello, elenca ogni funzione e le tue scorciatoie.
walkthroughDoneText=Puoi riaprire questa guida in qualsiasi momento da Aiuto.
walkthroughPrepTitle=Preparazione
walkthroughPrepIntro=Il tutorial è pratico: TypeR apre una pagina di esercitazione con quattro punti numerati e un breve script di esercitazione, una riga per punto.
walkthroughPrepOpenText=Apri la pagina di esercitazione in Photoshop.
walkthroughPrepOpenResult=Si apre come un normale documento: 4 punti numerati, da leggere da destra a sinistra come un manga. Chiudila senza salvare alla fine.
walkthroughPrepScriptText=Carica lo script di esercitazione. Si apre in una nuova scheda: i tuoi script restano intatti.
walkthroughPrepScriptResult=Qui va la tua traduzione: incollala nel blocco di testo e TypeR la divide in righe.
walkthroughScriptTitle=Leggere lo script
walkthroughScriptIntro=TypeR lavora sempre su una riga dello script, la riga corrente: è il testo del prossimo incolla.
walkthroughScriptStep1=Nello script, fai clic sul bersaglio all'inizio della riga 2: diventa la riga corrente.
walkthroughScriptResult1=La riga corrente è evidenziata: è il testo del prossimo incolla.
walkthroughScriptStep2=Passa ora alla riga successiva con la freccia ↓ sotto l'anteprima, oppure con la tua scorciatoia.
walkthroughScriptResult2=TypeR ha saltato la riga che inizia con ##: è una nota per te, non viene mai incollata. Anche “Page 1” in alto è un indicatore di pagina e viene saltato.
walkthroughStyleTitle=Il tuo stile per i dialoghi
walkthroughStyleIntro=Uno stile è tutto ciò che serve a un livello di testo: font, dimensione, colore, contorno, spaziatura. TypeR lo applica a ogni testo che incolli.
walkthroughStyleStep1=Fai clic su “Aggiungi stile” sotto l'elenco degli stili.
walkthroughStyleStep1Existing=Nell'elenco, fai clic sullo stile che usi per i dialoghi, qualunque sia il suo nome. Nessuno va bene? Fai clic su “Aggiungi stile” sotto l'elenco.
walkthroughStyleCoach1=Dagli il nome che preferisci, scegli il font e la dimensione che usi per i dialoghi, poi fai clic su Salva.
walkthroughStyleResult1=Il tuo stile è nell'elenco ed è attivo. Fai clic su uno stile per attivarlo; la sua matita lo modifica.
walkthroughStyleResult1Existing=“{name}” è il tuo stile per i dialoghi nel tutorial: ogni incolla lo usa. Fai clic su uno stile per attivarlo; la sua matita lo modifica.
walkthroughPasteTitle=Incollare il testo
walkthroughPasteIntro=Il ciclo di base: seleziona un balloon in Photoshop, incolla e TypeR passa alla riga successiva.
walkthroughPasteStep1=Balloon 1: in Photoshop, prendi la Bacchetta magica (W) e fai clic dentro il balloon grande. Poi fai clic su Incolla nel pannello.
walkthroughPasteResult1=Un livello di testo con il tuo stile, centrato nel balloon: le righe seguono la sua forma tonda. TypeR è passato da solo alla riga 2.
walkthroughPasteStep2=Balloon 2: stesso gesto, e stavolta incolla con la tua scorciatoia.
walkthroughPasteResult2=Selezione, incolla: tutto il ciclo è qui. Con la scorciatoia, le tue mani non lasciano mai Photoshop.
walkthroughPasteStep3=Nessun balloon nel punto 3: prendi lo strumento Selezione rettangolare (M), traccia un rettangolo nella cornice tratteggiata, poi incolla.
walkthroughPasteResult3=Un rettangolo o un lazo posiziona il testo ovunque: didascalie, testo sul disegno…
walkthroughShoutTitle=Uno stile per ogni tipo di testo
walkthroughShoutIntro=Un tag all'inizio di una riga dello script sceglie il suo stile: la riga viene incollata con quello stile, senza il tag.
walkthroughShoutStep1=La riga 4 inizia con un tag. Crea il suo stile a partire dal tuo stile per i dialoghi: clic destro su di esso nell'elenco, poi “Duplica stile”.
walkthroughShoutStep1Edit=Ora fai clic sulla matita della copia per modificarla.
walkthroughShoutStep1Reuse=La riga 4 inizia con un tag. Hai già uno stile per le urla, “{name}”: assegnagli questo tag invece di crearne uno nuovo. Fai clic sulla sua matita.
walkthroughShoutCoach1=Scrivi {prefix} in “Tag per la scelta automatica dello stile”, scegli un font più marcato e un altro nome se vuoi, poi fai clic su Salva.
walkthroughShoutCoach1Reuse=Scrivi {prefix} in “Tag per la scelta automatica dello stile”, poi fai clic su Salva.
walkthroughShoutResult1=Ora ogni riga che inizia con {prefix} riceve lo stile Urlo: TypeR lo imposta come stile corrente non appena quella riga diventa la riga corrente.
walkthroughShoutResult1Existing=Il tuo stile “{name}” ha già il tag {prefix}: ogni riga che inizia con esso riceve quello stile, non appena quella riga diventa la riga corrente.
walkthroughShoutStep2=Il balloon 4 è a punte: incollaci dentro la riga 4.
walkthroughShoutResult2=Il tag ha scelto lo stile Urlo ed è stato escluso dal testo. Un tag ha sempre la precedenza: lo stile che l'incolla intelligente sceglie per i balloon a punte vale solo per le righe senza tag.
walkthroughShoutResult2Missed=Questo testo non ha ricevuto lo stile Urlo. Annullalo in Photoshop (Ctrl+Z, Cmd+Z su Mac), controlla che il tag dello stile Urlo sia scritto esattamente come nello script e che si trovi nella stessa cartella dello stile per i dialoghi, poi incolla di nuovo la riga 4.
walkthroughRetouchTitle=Ritoccare un testo
walkthroughRetouchIntro=Un testo già presente nella pagina può essere ricentrato o ricevere un altro stile, senza doverlo riscrivere.
walkthroughRetouchStep1=In Photoshop, sposta il testo del balloon 1 fuori centro con lo strumento Sposta (V). Poi seleziona di nuovo il balloon 1 con la Bacchetta magica e fai clic su Allinea.
walkthroughRetouchResult1=Il testo è tornato al centro della selezione. Comodo dopo aver ridimensionato un testo.
walkthroughRetouchStep2=Seleziona il livello di testo del balloon 2 nel pannello Livelli, poi fai clic sul pulsante ➜ dello stile Urlo nell'elenco.
walkthroughRetouchResult2=Il livello ha preso lo stile Urlo mantenendo il suo testo. Ctrl+clic su ➜ mantiene anche la sua dimensione attuale.
walkthroughBackupTitle=Fare il backup degli stili
walkthroughBackupIntro=I tuoi stili e le tue impostazioni stanno in un unico file: conservane una copia, portalo su un altro computer o condividilo con il tuo team.
walkthroughBackupStep1=Apri le impostazioni con l'ingranaggio in fondo al pannello, poi la scheda Dati e “Esporta stili o impostazioni”.
walkthroughBackupCoach1=Scegli cosa salvare, fai clic su Salva, poi scegli dove mettere il file.
walkthroughBackupResult1=Conserva questo file al sicuro: “Importa stili o impostazioni”, nella stessa scheda, rimette tutto a posto.
walkthroughProgress=Avanzamento del tutorial
walkthroughBack=Indietro
walkthroughNext=Avanti
walkthroughDone=Fine
walkthroughDoneStatus=Fatto

