whatsNewPrepStyleCreateText=Non hai ancora nessuno stile: fai clic su “Aggiungi stile” sotto l'elenco per creare il tuo stile per i dialoghi.
whatsNewPrepStyleCoach=Dai un nome allo stile, scegli il font dei tuoi dialoghi, poi fai clic su Salva.
whatsNewBubblesStep3Edit=Ora fai clic sulla matita della copia per modificarla.
whatsNewBubblesCoach3=Imposta Tipo di balloon su Urlo, scegli un font che urla e un altro nome se vuoi, poi fai clic su Salva.
whatsNewBubblesCoach3Reuse=Imposta Tipo di balloon su Urlo, poi fai clic su Salva.
whatsNewWorkflowCoach3=Preset di dimensione: aggiungi fino a tre dimensioni, poi fai clic su una per attivarla. La scorciatoia “Preset di dimensione del testo successivo” le scorre.
whatsNewFontsCoach=Font FindeR: cerca font, visualizzane l'anteprima con il tuo testo e installane uno con un clic.
