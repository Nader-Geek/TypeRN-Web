whatsNewPasteOnClickStep4=Nessun balloon nel punto 5: in Photoshop, prendi lo strumento Selezione rettangolare (M) e traccia un rettangolo nella cornice tratteggiata. La riga viene incollata appena rilasci.
whatsNewPasteOnClickResult4=Un rettangolo o un lazo posiziona il testo ovunque, anche sul disegno: comodo per didascalie e testo fuori dai balloon.
whatsNewBubblesStep6=I riquadri di narrazione funzionano allo stesso modo, con lo stile contrassegnato “Narrazione”. Fai clic sulla matita dello stile che vuoi usare per loro, oppure duplica di nuovo il tuo stile per i dialoghi.
whatsNewBubblesCoach6=Imposta Tipo di balloon su Narrazione, scegli il font delle tue didascalie e un altro nome se vuoi, poi fai clic su Salva.
whatsNewBubblesCoach6Reuse=Imposta Tipo di balloon su Narrazione, poi fai clic su Salva.
